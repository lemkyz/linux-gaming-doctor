[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-gaming-doctor"
version = "0.1.0"
description = "Evidence-driven diagnostics for Linux gaming"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["linux", "gaming", "proton", "steam", "fedora", "diagnostics"]
dependencies = []

[project.scripts]
gaming-doctor = "gaming_doctor.__main__:main"
